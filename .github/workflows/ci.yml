name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: phpunit:11
      - name: Lint
        run: find src lib tests demo/project/supertext-demo -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: phpunit
      - name: Bundled Supertext SDK matches its recorded commit
        run: |
          scripts/vendor-sdk.sh "$(cat lib/supertext-sdk/COMMIT)"
          if [ -n "$(git status --porcelain -- lib/supertext-sdk)" ]; then
            git status --short -- lib/supertext-sdk
            echo "::error::lib/supertext-sdk differs from the SDK commit in lib/supertext-sdk/COMMIT: run scripts/vendor-sdk.sh <commit>"
            exit 1
          fi
      - name: Bundled Supertext Plugin Health matches its recorded commit
        run: |
          scripts/vendor-plugin-health.sh "$(cat lib/supertext-plugin-health/COMMIT)"
          if [ -n "$(git status --porcelain -- lib/supertext-plugin-health)" ]; then
            git status --short -- lib/supertext-plugin-health
            echo "::error::lib/supertext-plugin-health differs from the commit in lib/supertext-plugin-health/COMMIT: run scripts/vendor-plugin-health.sh <commit>"
            exit 1
          fi

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer, phpstan:2.3
          coverage: none
      - name: Install Akeneo PIM (PHPStan needs its classes)
        run: |
          mkdir -p "$RUNNER_TEMP/pim"
          cp demo/project/composer.json "$RUNNER_TEMP/pim/"
          composer install -d "$RUNNER_TEMP/pim" --no-dev --no-scripts --no-plugins --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: AKENEO_VENDOR="$RUNNER_TEMP/pim/vendor" phpstan analyse --no-progress --memory-limit=2G --error-format=github

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["3306:3306"]
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          indices.id_field_data.enabled: "true"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 5s --health-retries 30
        ports: ["9200:9200"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the demo image (Akeneo PIM 2026.4 with the bundle)
        run: docker build -f demo/Dockerfile -t supertext-akeneo-demo .
      - name: Start the stand-in API
        run: node tests/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check the accounts, translate the samples
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/railway
        run: tests/demo-check.sh
      - if: failure()
        run: docker logs demo 2>&1 | tail -150; cat stand-in.log
