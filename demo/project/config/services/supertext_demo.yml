                pim_catalog.updater.attribute_option: '@pim_catalog.updater.attribute_option'
                pim_catalog.saver.attribute_option: '@pim_catalog.saver.attribute_option'
                pim_catalog.repository.attribute_option: '@pim_catalog.repository.attribute_option'
