<VirtualHost *:8080>
    DocumentRoot /srv/pim/public
    <Directory /srv/pim/public>
        AllowOverride None
        Require all granted
        Options -MultiViews
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    <Directory /srv/pim>
        Options FollowSymlinks
    </Directory>

    <Directory /srv/pim/public/bundles>
        RewriteEngine Off
    </Directory>

    ErrorLog /dev/stderr
    LogLevel warn
    CustomLog /dev/null common
</VirtualHost>
